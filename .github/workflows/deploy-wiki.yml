name: Deploy Wiki to Website

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'scripts/build_wiki_site.py'
      - 'scripts/check_generated_wiki_links.py'
      - 'scripts/wiki_quality_common.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
        with:
          path: before-we-build-research

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: before-we-build/before-we-build.github.io
          path: before-we-build.github.io
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run wiki quality validations
        working-directory: before-we-build-research
        run: |
          python3 scripts/validate_wiki.py --strict
          python3 scripts/check_wikilinks.py --strict

      - name: Build static HTML wiki
        working-directory: before-we-build-research
        run: |
          python3 scripts/build_wiki_site.py --output ../before-we-build.github.io/wiki

      - name: Verify generated wiki links
        working-directory: before-we-build-research
        run: >-
          python3 scripts/check_generated_wiki_links.py
          --root ../before-we-build.github.io/wiki
          --site-root ../before-we-build.github.io

      - name: Commit and push changes to website
        working-directory: before-we-build.github.io
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/
          if git diff --staged --quiet; then
            echo "No changes in wiki site output to commit."
          else
            git commit -m "docs(wiki): sync knowledge base from research (${{ github.sha }})"
            git push origin main
          fi
